<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" role="img" aria-labelledby="title desc">
  <title id="title">Nulea Mouse Mapper</title>
  <desc id="desc">Device-scoped Windows button remapping, shown with a stylized mouse and routed input signals.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1117"/>
      <stop offset="0.5" stop-color="#111b22"/>
      <stop offset="1" stop-color="#090d11"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#c9ff62"/>
      <stop offset="1" stop-color="#62d8ff"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#62d8ff" stop-opacity=".24"/>
      <stop offset="1" stop-color="#62d8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="trackball" cx="35%" cy="28%" r="72%">
      <stop offset="0" stop-color="#e9ffb8"/>
      <stop offset=".34" stop-color="#c9ff62"/>
      <stop offset="1" stop-color="#55bba9"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".045"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1400" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1400" height="360" rx="28" fill="url(#grid)"/>
  <ellipse cx="1145" cy="170" rx="310" ry="260" fill="url(#halo)"/>
  <path d="M0 292C286 251 435 340 694 298s413-112 706-58v120H0Z" fill="#c9ff62" fill-opacity=".025"/>

  <g transform="translate(80 64)">
    <rect width="44" height="8" rx="4" fill="url(#accent)"/>
    <text x="0" y="56" fill="#f5f7f1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="54" font-weight="760" letter-spacing="-2">NULEA MOUSE MAPPER</text>
    <text x="1" y="94" fill="#9ca8ae" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" letter-spacing="2.2">DEVICE-SCOPED WINDOWS BUTTON REMAPPING</text>

    <g transform="translate(0 154)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">
      <g><rect width="146" height="34" rx="17" fill="#c9ff62" fill-opacity=".10" stroke="#c9ff62" stroke-opacity=".35"/><circle cx="18" cy="17" r="4" fill="#c9ff62"/><text x="31" y="21" fill="#dfffa1">DEVICE-SCOPED</text></g>
      <g transform="translate(158)"><rect width="104" height="34" rx="17" fill="#62d8ff" fill-opacity=".09" stroke="#62d8ff" stroke-opacity=".3"/><circle cx="18" cy="17" r="4" fill="#62d8ff"/><text x="31" y="21" fill="#a8ebff">WINDOWS</text></g>
      <g transform="translate(274)"><rect width="145" height="34" rx="17" fill="#fff" fill-opacity=".04" stroke="#fff" stroke-opacity=".14"/><circle cx="18" cy="17" r="4" fill="#b8c0c4"/><text x="31" y="21" fill="#cdd3d5">LOCAL-FIRST</text></g>
    </g>
  </g>

  <g transform="translate(1028 8)">
    <circle cx="136" cy="165" r="144" fill="none" stroke="#62d8ff" stroke-opacity=".09"/>
    <circle cx="136" cy="165" r="108" fill="none" stroke="#c9ff62" stroke-opacity=".07" stroke-dasharray="5 10"/>

    <!-- Original vector interpretation of the Nulea M505 reference silhouette. -->
    <path d="M98 13C54 14 28 33 25 72c-2 25 9 42 1 70-10 35-8 58 10 80 13 16 31 28 43 49 10 18 9 47 16 68 7 22 26 30 50 24 46-11 78-41 91-83 17-55 15-122-8-179-19-46-62-89-130-88Z" fill="#101a21" stroke="#d6e0e3" stroke-opacity=".5" stroke-width="2"/>
    <path d="M145 19c27 12 52 34 69 64l-2 74c-1 15-8 27-17 34-13-7-19-21-18-39l3-97" fill="#0b1319" stroke="#d6e0e3" stroke-opacity=".28" stroke-width="1.4"/>
    <path d="M232 113c12 42 14 92 3 136M91 268c6 22 5 47 10 66" fill="none" stroke="#d6e0e3" stroke-opacity=".16" stroke-linecap="round"/>

    <!-- Prominent M505 thumb trackball. -->
    <circle cx="96" cy="85" r="49" fill="#0a1117" stroke="#d6e0e3" stroke-opacity=".28" stroke-width="1.5"/>
    <circle cx="96" cy="85" r="43" fill="none" stroke="#c9ff62" stroke-opacity=".35" stroke-width="2"/>
    <circle cx="96" cy="85" r="37" fill="url(#trackball)" filter="url(#glow)"/>
    <path d="M74 65c15-14 37-13 51-1M67 87c11 21 38 32 59 18M82 49c-14 10-22 24-23 40" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Side controls: two buttons framing the textured scroll wheel. -->
    <g transform="translate(34 139) rotate(-18)">
      <rect x="0" y="-18" width="25" height="34" rx="8" fill="#c9ff62" fill-opacity=".12" stroke="#c9ff62" stroke-opacity=".7"/>
      <rect x="2" y="52" width="25" height="35" rx="8" fill="#62d8ff" fill-opacity=".11" stroke="#62d8ff" stroke-opacity=".62"/>
      <rect x="9" y="14" width="17" height="43" rx="8" fill="#081016" stroke="#d6e0e3" stroke-opacity=".42"/>
      <path d="M13 22h9m-9 6h9m-9 6h9m-9 6h9m-9 6h9" stroke="#9ca8ae" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <path d="M52 116c-9 9-16 24-18 41M35 190c4 14 12 27 25 39" fill="none" stroke="#d6e0e3" stroke-opacity=".22"/>

    <text x="168" y="326" transform="rotate(-15 168 326)" fill="#d6e0e3" fill-opacity=".65" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1">M505</text>

    <path d="M-99 130h124l14 5M-99 202h106l35-2" fill="none" stroke="url(#accent)" stroke-width="2" stroke-dasharray="3 7"/>
    <g fill="#0b1116" stroke="#fff" stroke-opacity=".16">
      <rect x="-171" y="112" width="72" height="36" rx="10"/><rect x="-171" y="184" width="72" height="36" rx="10"/>
    </g>
    <text x="-135" y="135" text-anchor="middle" fill="#c9ff62" font-family="ui-monospace,Consolas,monospace" font-size="12" font-weight="700">B3 → R</text>
    <text x="-135" y="207" text-anchor="middle" fill="#62d8ff" font-family="ui-monospace,Consolas,monospace" font-size="12" font-weight="700">R  ×</text>
  </g>

  <g transform="translate(1348 38)" aria-label="Project information">
    <circle r="19" fill="#fff" fill-opacity=".045" stroke="#fff" stroke-opacity=".22"/>
    <circle r="13" fill="none" stroke="#62d8ff" stroke-opacity=".34"/>
    <text x="0" y="6" text-anchor="middle" fill="#a8ebff" font-family="Georgia,serif" font-size="20" font-weight="700">i</text>
  </g>

  <rect x="1" y="1" width="1398" height="358" rx="27" fill="none" stroke="#fff" stroke-opacity=".09"/>
</svg>
